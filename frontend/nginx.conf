server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript;

    # Angular SPA: all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively (Angular adds content hash to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html — it must always be fresh
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
