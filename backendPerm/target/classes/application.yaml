server:
  port: 8001

spring:
  application:
    name: koreon-backendperm

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/koreontech}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  web:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

app:
  jwt:
    secret: ${JWT_SECRET:koreon-tech-dev-secret-must-be-at-least-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24h
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}  # 7 days
  broker:
    api-key: ${BROKER_API_KEY:koreon-broker-dev-key}   # Python usa esta chave para publicar eventos WebSocket

management:
  endpoints:
    web:
      exposure:
        include: health,info
